<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<body><script>
// HasGym app screens redrawn for the website, from the app's layouts. ?s=<name> picks one; tools/render_screens.sh shoots them all.
const sv = (d, a = '') => `<svg viewBox="0 0 24 24" ${a}>${d}</svg>`;
const I = {
  info: sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.4v.4"/>'),
  gear: sv('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3.5v6M19.4 16.200l-5.200-3M4.600 16.200l5.200-3"/>'),
  cal: sv('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 9.500h16"/>'),
  back: sv('<path d="M14.500 5.500 8 12l6.500 6.500"/>'), x: sv('<path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/>'),
  home: sv('<path d="M3 11.2 12 3.500l9 7.700V20a1 1 0 0 1-1 1h-5.200v-6.200H9.200V21H4a1 1 0 0 1-1-1z"/>'),
  timer: sv('<path d="M9 1.800h6v2H9zM12 5.200a8.400 8.400 0 1 0 0 16.800 8.400 8.400 0 0 0 0-16.800zm1 9.400h-2V8.800h2z"/>'),
  chart: sv('<rect x="3" y="11" width="5" height="10" rx="1.500"/><rect x="9.500" y="7" width="5" height="14" rx="1.500"/><rect x="16" y="3" width="5" height="18" rx="1.500"/>'),
  rw: sv('<path d="M11 6v12L3 12zM21 6v12l-8-6z"/>'), ff: sv('<path d="M13 6v12l8-6zM3 6v12l8-6z"/>'), pause: sv('<path d="M6 4h4.500v16H6zM13.500 4H18v16h-4.500z"/>'),
  db: sv('<path d="M2 10h2v4H2zM5 7h2.500v10H5zM8.500 11h7v2h-7zM16.500 7H19v10h-2.500zM20 10h2v4h-2z"/>'),
  fork: sv('<path d="M7 2v7a2 2 0 0 0 2 2v11h2V11a2 2 0 0 0 2-2V2h-1.500v6h-1V2H9v6H8.500V2zM16 2c-1.500 1-2.500 3-2.500 6v5H16v9h2V2z" transform="translate(-1.500)"/>'),
};
const sb = `<div class="sb"><span>9:41</span><svg viewBox="0 0 78 14"><rect x="0" y="9" width="3.500" height="5" rx="1"/><rect x="5.500" y="6" width="3.500" height="8" rx="1"/><rect x="11" y="3" width="3.500" height="11" rx="1"/><rect x="16.500" y="0" width="3.500" height="14" rx="1"/><path d="M34.500 2.200c3 0 5.700 1.200 7.700 3.100l-1.700 1.800a8.700 8.700 0 0 0-12 0l-1.700-1.800a11.200 11.200 0 0 1 7.700-3.100zm0 4.800c1.700 0 3.200.7 4.300 1.800l-1.800 1.800a3.600 3.600 0 0 0-5 0l-1.800-1.800A6.100 6.100 0 0 1 34.500 7zm0 4.200 1.700 1.800-1.700 1.700-1.700-1.700z"/><rect x="50" y="1" width="25" height="12" rx="3.800" opacity=".4"/><rect x="51.500" y="2.500" width="22" height="9" rx="2.400"/><rect x="76" y="5" width="1.800" height="4" rx=".9" opacity=".5"/></svg></div>`;
const nav = (t, l = I.info, r = '', cls = '') => `<div class="nv"><h1 class="${cls}">${t}</h1><span class="cb ${l === I.back ? 'wt' : ''}">${l}</span>${r ? `<span class="cb">${r}</span>` : '<span></span>'}</div>`;
const tabbar = on => `<div class="fade"></div><div class="tb">${[['home', 'Home'], ['timer', 'Timer'], ['chart', 'Progress']].map(([k, l]) => `<span class="${k === on ? 'on' : ''}">${I[k]}${l}</span>`).join('')}</div>`;
const bar = (p, c = '') => `<u class="br"><i style="width:${p}%;${c ? 'background:' + c : ''}"></i></u>`;
const ZC = ['#5ac8fa', '#4cd964', '#ffd60a', '#ff9f0a', '#ff5a4f'];
const zl = z => `<span class="zl">${ZC.map((c, i) => `<i style="${i <= z ? 'background:' + c : ''}"></i>`).join('')}</span>`;

// ---- Home
const home = `<div class="s">${sb}${nav('HOME', I.info, I.gear)}<div class="bd">
  <div class="c sc"><div class="row" style="margin-bottom:12px"><span class="k">SET COUNTS</span><span class="pillb">This Week ⌄</span></div>
  ${[['Chest', 100, 12], ['Back', 100, 12], ['Quads', 75, 9], ['Shoulders', 58, 7], ['Biceps', 50, 6], ['Triceps', 33, 4]].map(([n, p, s]) => `<p>${n}${bar(p)}<span>${s} sets</span></p>`).join('')}
  <div class="dim" style="font-size:13.500px;margin-top:10px">50 sets this week</div></div>
  <div class="big"><i>${I.db}</i><div><b>Exercises</b><small>Last: Chest, Shoulders · today</small></div><u>+</u></div>
  <div class="big"><i>${I.fork}</i><div><b>Meals</b><small>Last: Lunch · today</small></div><u>+</u></div>
  <div class="sh row">SAVED TIMERS<span class="g">Edit</span></div>
  <div class="tiles"><div class="plus">+</div>
  <div class="ti"><em>INTERVAL</em><b>HIIT</b><span class="o">A</span> 0:40 · <span class="b">R</span> 0:20<br><span class="dim">20 sets · 20:00</span></div>
  <div class="ti"><em style="color:#6bd47a">REPEAT</em><b>Lifting</b>Repeat 2:00<br><span class="dim">20 sets · 40:00</span></div></div>
  </div>${tabbar('home')}</div>`;

// ---- Workout
const ringSvg = (col, f) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" stroke="rgba(255,255,255,.14)"/><circle cx="50" cy="50" r="48" stroke="${col}" stroke-linecap="round" stroke-dasharray="301.600" stroke-dashoffset="${301.6 * (1 - f)}"/></svg>`;
const wkTop = `${sb}<div class="wh">INTERVAL<small>STRENGTH</small></div><span class="cb x wx">${I.x}</span>`;
const ctl = (page) => `<div class="dots">${[0, 1, 2].map(i => `<i class="${i === page ? 'on' : ''}"></i>`).join('')}</div><div class="ct"><span>${I.rw}</span><span class="p">${I.pause}</span><span>${I.ff}</span></div>`;
const stats = (top, hr, cal) => `<div class="st" style="top:${top}px"><div><p><span class="hrt">♥</span><b class="d">${hr}</b> <span>bpm</span></p>${zl(2)}</div><div><b class="d">${cal}</b><small>ACTIVE CAL</small></div></div>`;
const mini = `<div class="mini"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,.16)"/><circle cx="50" cy="50" r="42" stroke="#ff9f0a" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="100"/></svg><em class="o">ACTIVE</em><b class="d">0:15</b><p>12:25 elapsed<span>12/30 sets</span></p></div>`;
const workout = `<div class="s act">${wkTop}<div class="ring">${ringSvg('#ffa726', .62)}<div class="rc"><span class="pl" style="background:#f0731c">ACTIVE</span><b class="d">0:15</b><small>Next: Rest 0:20</small></div></div>
  <div class="pr"><div class="row"><span><b class="d">12:25</b>/30:00</span><span><b class="d">12</b> / 30 sets done</span></div>${bar(41)}</div>${stats(444, 148, 186)}${ctl(0)}</div>`;
const zones = `<div class="s act">${wkTop}${mini}${stats(208, 148, 186)}
  <div class="c zc"><div class="row" style="padding:0 8px 8px"><span class="k">HEART RATE ZONES</span><span style="font-size:14px"><span class="hrt" style="font-size:14px">♥</span><b>141</b> <span class="dim">avg ·</span> <b>163</b> <span class="dim">max</span></span></div>
  ${[['Z1', '< 132 bpm', 22, '1:48'], ['Z2', '132–146 bpm', 58, '4:02'], ['Z3', '146–159 bpm', 100, '5:10'], ['Z4', '159–173 bpm', 26, '1:25'], ['Z5', '≥ 173 bpm', 0, '–']].map(([z, r, p, t], i) =>
    `<div class="zr ${i === 2 ? 'on' : ''}" style="${i === 2 ? 'background:rgba(255,214,10,.16)' : ''}"><p><b style="color:${ZC[i]}">${z}</b>${r}</p>${bar(p, ZC[i])}<span class="m">${t}</span></div>`).join('')}</div>${ctl(1)}</div>`;
const exr = (n, d, done = true) => `<div class="exr"><i class="${done ? '' : 'n'}">${done ? '✓' : ''}</i><p><b>${n}</b>${d}</p><u>›</u></div>`;
const logex = `<div class="s act">${wkTop}${mini}<div class="ex" style="top:214px"><div class="k" style="margin:0 4px 10px">EXERCISES TODAY</div>
  <div class="c" style="padding:2px 14px">${exr('Bench Press', '155 lb · 3×8')}${exr('Incline Dumbbell Press', '50 lb · 3×10')}${exr('Shoulder Press', '95 lb · 2 of 3 sets', false)}</div>
  <div class="addb">＋&nbsp; Add Exercise</div></div>${ctl(2)}</div>`;
const lock = `<div class="s lock">${sb}<div class="date">Thursday, November 12</div><div class="clk">9:41</div>
  <div class="la"><div class="hd"><b>ACTIVE</b>Interval · 13/30</div><div class="bdy"><div class="t d">0:15<small>Next: Rest 0:20</small></div>
  <div class="gr"><div><b class="d"><span style="color:#ff453a;font-size:15px">♥</span> 148</b>${zl(2).replace('zl"', 'zl" style="margin-top:4px;transform:scale(.7)"')}</div><div><b class="d">186</b><small>ACTIVE CAL</small></div>
  <div><b class="d">12:25</b><small>ELAPSED</small></div><div style="background:#f0731c">${sv('<path d="M6 4h4.500v16H6zM13.500 4H18v16h-4.500z" fill="#fff"/>', 'style="width:20px;height:20px"')}</div></div></div><div class="bar"><i></i></div></div>
  <span class="lk" style="left:46px"></span><span class="lk" style="right:46px"></span><i class="hb"></i></div>`;

// ---- Progress
const ptabs = on => `<div class="tabs">${['Calendar', 'Meals', 'Exercises'].map(t => t === on ? `<b>${t}</b>` : `<span>${t}</span>`).join('')}</div>`;
const dayRing = (meal, wk) => `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="3.500"/>${meal ? `<circle cx="16" cy="16" r="13" fill="none" stroke="#8fd04f" stroke-width="3.500" stroke-linecap="round" stroke-dasharray="81.700" stroke-dashoffset="${81.7 * (1 - meal)}" transform="rotate(-90 16 16)"/>` : ''}${wk ? '<circle cx="16" cy="16" r="4.500" fill="#ff9f0a"/>' : ''}</svg>`;
const calendar = (() => {
  const wk = [2, 3, 5, 6, 9, 10, 12], meal = { 1: .75, 2: 1, 3: .75, 4: 1, 5: .5, 6: 1, 7: .75, 8: .5, 9: 1, 10: 1, 11: .75, 12: .5 };
  let g = 'SMTWTFS'.split('').map(d => `<small>${d}</small>`).join('');
  for (let d = 1; d <= 30; d++) g += `<div class="${d > 12 ? 'f' : ''} ${d === 12 ? 'sel' : ''}"><span>${d}</span>${d <= 12 ? dayRing(meal[d], wk.includes(d)) : ''}</div>`;
  return `<div class="s">${sb}${nav('PROGRESS', I.info, I.cal)}${ptabs('Calendar')}<div class="pb" style="top:182px">
  <div class="row" style="margin-bottom:12px"><b style="font-size:23px">November 2026</b><span class="g" style="font-size:24px;letter-spacing:22px">‹›</span></div>
  <div class="row" style="font-size:13.500px;margin-bottom:6px"><span class="g">86% healthy</span><span class="dim">goal 80% · 31 of 36 meals</span></div>${bar(86)}
  <div class="cal" style="margin-top:14px">${g}</div></div>
  <div class="c" style="position:absolute;left:16px;right:16px;top:640px;height:200px"><div class="row"><b style="font-size:19px">Thursday, Nov 12</b><span class="g">Edit</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;font-size:15px"><div><div class="k" style="font-size:11px;margin-bottom:6px">MEALS</div><div class="row">Breakfast<b>5</b></div></div>
  <div style="border-left:1px solid rgba(255,255,255,.12);padding-left:14px"><div class="k" style="font-size:11px;margin-bottom:6px">WORKOUT</div><b class="o" style="font-size:17px">Strength</b></div></div></div>${tabbar('chart')}</div>`;
})();
const meals = `<div class="s">${sb}${nav('PROGRESS')}${ptabs('Meals')}<div class="pb">
  <div class="row"><span class="mp">November 2026 ⌄</span><span class="dim" style="font-size:14px">36 meals logged</span></div>
  <div class="c" style="margin-top:14px"><div class="row" style="margin-bottom:10px"><span><b style="font-size:25px">86%</b> healthy</span><span class="dim" style="font-size:14px">goal 80%</span></div>${bar(86)}<div class="dim" style="font-size:12.500px;margin-top:10px">Meals scored 3 or higher. Change in Settings ▸ Calendar.</div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${[['AVG SCORE', '4.1'], ['DAYS LOGGED', '12 / 30'], ['GOAL STREAK', '6 days']].map(([k, v]) => `<div class="c" style="padding:12px"><div class="k" style="font-size:10.500px">${k}</div><b class="m" style="font-size:20px;display:block;margin-top:6px">${v}</b></div>`).join('')}</div>
  <div class="c" style="margin-top:12px"><div class="row"><b>Average score</b><span class="dim" style="font-size:14px">by day</span></div>
  <div style="display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:14px">${[70, 90, 76, 96, 60, 88, 78, 64, 92, 100, 80, 72].map(h => `<i style="flex:1;height:${h}%;border-radius:4px;background:#57a85c"></i>`).join('')}</div></div>
  <div class="c" style="margin-top:12px"><b>By meal</b>${[['Breakfast', 90, '4.5', '#9bd05a'], ['Lunch', 80, '4.0', '#9bd05a'], ['Dinner', 84, '4.2', '#9bd05a'], ['Snacks', 62, '3.1', '#e5c84a']].map(([n, p, v, c]) => `<p style="display:grid;grid-template-columns:86px 1fr 40px;align-items:center;margin-top:11px;font-size:16px">${n}${bar(p, c)}<span class="m" style="text-align:right;font-size:15px">${v}</span></p>`).join('')}</div>
  </div>${tabbar('chart')}</div>`;
const spark = k => `<svg viewBox="0 0 62 24" style="width:62px;height:24px;fill:none;stroke:#6bd47a;stroke-width:2;stroke-linecap:round"><path d="${k === 'up' ? 'M2 20C14 20 22 16 30 8s18-6 30-4' : k === 'flat' ? 'M2 12h58' : 'M2 5 60 19'}"/></svg>`;
const exercises = `<div class="s">${sb}${nav('PROGRESS')}${ptabs('Exercises')}<div class="pb">
  <div class="row"><span class="mp">November 2026 ⌄</span><span class="dim" style="font-size:14px">7 exercise days</span></div>
  <div class="c" style="margin-top:14px;padding:14px 16px"><div class="row" style="margin-bottom:6px"><span class="k">TOP MUSCLES</span><span class="g" style="font-size:13.500px;font-weight:600">See All ›</span></div>
  ${[['Chest', 100, 4], ['Back', 75, 3], ['Quads', 75, 3]].map(([n, p, d], i) => `<p style="display:grid;grid-template-columns:26px 92px 1fr 62px;align-items:center;height:28px;font-size:16.500px"><span class="dim" style="font-size:13px">${i + 1}</span>${n}${bar(p)}<b style="text-align:right;font-weight:600">${d} days</b></p>`).join('')}</div>
  <div class="chips" style="margin-top:12px"><span>All</span><span class="on">Upper</span><span>Lower</span><span>Core</span><span>Push Day</span></div>
  <div class="chips" style="margin-top:8px;font-size:14px"><span>Chest</span><span>Back</span><span>Shoulders</span><span>Biceps</span><span>Triceps</span></div>
  <div class="k" style="margin:14px 4px 8px">UPPER BODY</div>
  <div class="lst">${[['Bench Press', 'CHEST', '155 × 8 · 155 × 8 · 155 × 8', 'up', '+10 lb'], ['Lat Pulldown', 'BACK', '120 lb · 3×10', 'flat', 'steady'], ['Shoulder Press', 'SHOULDERS', '95 lb · 3×8', 'up', '+5 lb'], ['Barbell Curl', 'BICEPS', '60 lb · 3×10', 'down', '3×12 → 3×10'], ['Triceps Pushdown', 'TRICEPS', '50 lb · 3×12', 'flat', 'steady']].map(([n, t, d, k, l]) =>
    `<div style="height:58px"><p style="line-height:1.4"><b>${n}</b><span class="tag">${t}</span><br><span class="dim" style="font-size:13px">${d}</span></p><p style="display:grid;justify-items:end;font-size:12.500px;font-weight:600" class="g">${spark(k)}${l}</p></div>`).join('')}</div>
  </div>${tabbar('chart')}</div>`;
const exTop = on => `${sb}${nav('Bench Press', I.back, '', 't')}<div class="bd" style="top:122px"><div class="seg">${['By Weight', 'Progression', 'History'].map(t => `<span class="${t === on ? 'on' : ''}">${t}</span>`).join('')}</div>`;
const SS = [158, 162, 167, 184, 169, 174, 191, 196, 181, 198, 204, 209, 207, 210, 216, 234, 220];
const strength = (() => {
  const X = i => 10 + i * 18.6, Y = v => 172 - (v - 150) * 1.6;
  const pts = SS.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
  return `<div class="s">${exTop('Progression')}
  <div class="c" style="margin-top:12px;padding:14px"><div class="row"><b style="font-size:19px">Strength Score <span class="g" style="font-size:14px">ⓘ</span></b><span class="dim" style="font-size:13px">best set each day</span></div>
  <svg viewBox="0 0 342 196" style="width:100%;margin-top:6px;font:500 9.500px Inter">${[150, 175, 200, 225, 250].map(v => `<path d="M0 ${Y(v)}H314" stroke="rgba(255,255,255,.14)"/><text x="342" y="${Y(v) + 3}" fill="rgba(255,255,255,.5)" text-anchor="end">${v}</text>`).join('')}
  <polyline points="${pts}" fill="none" stroke="#6bd47a" stroke-width="2"/>${SS.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="#6bd47a"/>${i % 2 === 1 || i === 16 ? `<text x="${X(i)}" y="${Y(v) - 8}" fill="#fff" text-anchor="middle" font-weight="600">${v}</text>` : ''}`).join('')}
  ${['Sep 20', 'Oct 4', 'Oct 18', 'Nov 1'].map((t, i) => `<text x="${24 + i * 84}" y="192" fill="rgba(255,255,255,.5)">${t}</text>`).join('')}</svg></div>
  <div class="k" style="margin:14px 4px 8px">BEST SET</div>
  <div class="lst">${[['Nov 12', '165 × 10 → 220'], ['Nov 9', '185 × 8 → 234'], ['Nov 5', '175 × 7 → 216'], ['Nov 2', '175 × 6 → 210'], ['Oct 29', '155 × 10 → 207'], ['Oct 26', '165 × 8 → 209'], ['Oct 22', '165 × 7 → 204'], ['Oct 19', '165 × 6 → 198']].map(([d, v]) => `<div><b>${d}</b><span>${v}</span></div>`).join('')}</div></div>${tabbar('chart')}</div>`;
})();
const byweight = (() => {
  let dots = '';
  for (let i = 0; i < 17; i++) { const top = 125 + Math.floor(i / 3) * 10 + (i % 3) * 2; const x = 12 + i * 18;
    [[0, 0], [7, 0], [3.5, 6]].forEach(([dx, dy]) => dots += `<circle cx="${x + dx}" cy="${190 - (top - 110) * 2 + dy}" r="2.800"/>`);
    dots += `<circle cx="${x + 3}" cy="${190 - (top - 30 - 110) * 2}" r="2.800"/>`; }
  return `<div class="s">${exTop('By Weight')}
  <div class="chips" style="margin-top:12px"><span class="on">All</span><span>185 lb <small class="dim">×2</small></span><span>165 lb <small class="dim">×5</small></span><span>175 lb <small class="dim">×3</small></span><span>155 lb</span></div>
  <div class="c" style="margin-top:12px;padding:14px"><div class="row"><b style="font-size:19px">Weight over time</b><span class="dim" style="font-size:13px">one dot per set</span></div>
  <svg viewBox="0 0 342 200" style="width:100%;margin-top:10px;font:500 9.500px Inter">${[120, 140, 160, 180].map(v => `<path d="M0 ${190 - (v - 110) * 2}H314" stroke="rgba(255,255,255,.14)"/><text x="342" y="${193 - (v - 110) * 2}" fill="rgba(255,255,255,.5)" text-anchor="end">${v}</text>`).join('')}<g fill="#6bd47a">${dots}</g></svg>
  <div class="row dim" style="font-size:12px;padding:6px 30px 0 10px"><span>Sep 20</span><span>Oct 4</span><span>Oct 18</span><span>Nov 1</span></div>
  <div class="g" style="font-size:14px;margin-top:12px">↗&nbsp; Trending up = heavier sets over time</div></div></div>${tabbar('chart')}</div>`;
})();

// ---- Watch
const track = (col, f) => `<svg viewBox="0 0 190 56"><path d="M95 2H176a12 12 0 0 1 12 12V42a12 12 0 0 1-12 12H14A12 12 0 0 1 2 42V14A12 12 0 0 1 14 2H95" stroke="rgba(255,255,255,.14)"/><path d="M95 2H176a12 12 0 0 1 12 12V42a12 12 0 0 1-12 12H14A12 12 0 0 1 2 42V14A12 12 0 0 1 14 2H95" stroke="${col}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 * (1 - f)}"/></svg>`;
const watch = (cls, name, col, t, f, tiles) => `<div class="w ${cls}"><div class="top"><b style="color:${col}">${name}</b><span>9:41</span></div><div class="wbig">${track(col, f)}<b class="d">${t}</b></div>
  <div class="wg">${tiles.map(([v, l]) => l === 'HR' ? `<div style="padding-top:12px"><b><span style="color:#ff453a;font-size:17px">♥</span> ${v}</b><span class="zl" style="margin-top:7px">${ZC.map((c, i) => `<i style="width:13px;${i <= 2 ? 'background:' + c : ''}"></i>`).join('')}</span></div>` : `<div><b>${v}</b><small>${l}</small></div>`).join('')}</div><div class="wd"><i></i><i class="on"></i></div></div>`;
const S = { home, workout, zones, logex, lock, calendar, meals, exercises, strength, byweight,
  'watch-active': watch('act', 'ACTIVE', '#ffa726', '0:15', .62, [['12:25', 'ELAPSED'], ['12/30', 'SETS'], ['18', 'SETS LEFT'], ['17:35', 'TIME LEFT']]),
